plugins {
    id "com.android.application"
}

def releaseSigningEnvironment = [
    storeFile: System.getenv("ANDROID_KEYSTORE_PATH"),
    storePassword: System.getenv("ANDROID_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("ANDROID_KEY_ALIAS"),
    keyPassword: System.getenv("ANDROID_KEY_PASSWORD")
]
def releaseSigningConfigured = releaseSigningEnvironment.values().every { it }

android {
    namespace "in.nammaurucab.app"
    compileSdk 35

    defaultConfig {
        applicationId "in.nammaurucab.app"
        minSdk 23
        targetSdk 35
        versionCode providers.gradleProperty("versionCode").orElse("1").get().toInteger()
        versionName providers.gradleProperty("versionName").orElse("1.0.0").get()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseSigningEnvironment.storeFile)
                storePassword releaseSigningEnvironment.storePassword
                keyAlias releaseSigningEnvironment.keyAlias
                keyPassword releaseSigningEnvironment.keyPassword
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register("validateReleaseSigning") {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                "Release builds require ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, " +
                        "ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            )
        }

        def keystore = file(releaseSigningEnvironment.storeFile)
        if (!keystore.isFile()) {
            throw new GradleException("Android release keystore not found at ${keystore}.")
        }
    }
}

tasks.configureEach {
    if (name == "assembleRelease" || name == "bundleRelease") {
        dependsOn("validateReleaseSigning")
    }
}
